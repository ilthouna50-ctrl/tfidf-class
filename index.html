<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words to Numbers: Bag of Words and TF-IDF</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1442;--gold:#ffd166;--pink:#ff6b9d;--sky:#4cc9f0;--mint:#80ed99;--tx:#f3f0ff;--mu:#b9b0e6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--tx);font:19px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;background:#1a1442}
.bl{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;animation:dr 18s ease-in-out infinite alternate;pointer-events:none;z-index:0}
.b1{width:55vw;height:55vw;background:#5b2fc0;top:-20vw;right:-10vw}.b2{width:45vw;height:45vw;background:#1f6fa8;bottom:-18vw;left:-10vw;animation-delay:-6s}
@keyframes dr{to{transform:translate(6vw,4vw) scale(1.15)}}
#nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap;padding:10px 5vw;background:rgba(26,20,66,.9);backdrop-filter:blur(8px)}
#nav b{font:800 20px "Bricolage Grotesque";margin-right:auto}
#nav a{color:var(--mu);text-decoration:none;font-weight:700;font-size:16px}#nav a:hover{color:var(--gold)}
#pg{position:fixed;top:0;left:0;height:5px;background:var(--gold);z-index:40;width:0}
main{position:relative;z-index:1}
.s{max-width:1180px;margin:0 auto;padding:70px 5vw 30px;opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s}
.s.in{opacity:1;transform:none}
#s0{padding-top:70px}
h2{font:800 clamp(30px,4.6vw,54px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 12px;letter-spacing:-.02em}
#s0 h2{font-size:clamp(48px,9vw,112px)}
.ex{color:var(--mu);max-width:78ch;margin:0 0 24px;font-size:clamp(17px,1.6vw,21px)}
button{font:inherit;font-weight:700;border-radius:12px;padding:9px 18px;border:2px solid var(--gold);cursor:pointer;background:var(--gold);color:var(--ink);margin:0 8px 8px 0}
button.ghost,.pk{background:transparent;color:var(--gold)}
.pk.on{background:var(--gold);color:var(--ink)}.pk small{margin-left:6px;opacity:.8}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
input[type=text],input:not([type]),input[type=number]{font:inherit;padding:10px 14px;border-radius:10px;border:2px solid var(--c,var(--gold));background:rgba(255,255,255,.08);color:var(--tx);width:100%}
input[type=range]{width:100%;accent-color:var(--gold)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:start}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.card,.say2{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:16px 20px;margin-bottom:14px}
.say2{min-height:3.4em;background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.5)}
.row{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}.row>b{width:56px;flex:none;padding-top:9px}.row>div{flex:1;min-width:0}
.tok{display:inline-block;margin:4px;padding:5px 13px;border-radius:999px;background:var(--c);color:var(--ink);font-weight:700;position:relative;transition:transform .3s,opacity .3s,box-shadow .3s}
.tok.hl{transform:scale(1.18);box-shadow:0 0 0 4px #fff}
.tok.first{box-shadow:0 0 0 3px #fff,0 0 22px var(--c)}
.tok.first::after,.tok.rep::after{content:"1st";position:absolute;top:-11px;right:-6px;background:#fff;color:var(--ink);font-size:11px;padding:0 6px;border-radius:8px}
.tok.rep::after{content:attr(data-n);background:var(--pink);color:#fff}
.tok.rep,.tok.dup{opacity:.55}.tok.dup{opacity:.3}
.bag2{display:flex;flex-wrap:wrap;gap:16px;border:3px solid var(--gold);border-radius:6px 6px 28px 28px;padding:24px 16px 16px;margin-top:34px;position:relative;background:rgba(255,209,102,.08);min-height:96px}
.bag2::before{content:"";position:absolute;top:-30px;left:50%;width:90px;height:44px;margin-left:-45px;border:3px solid var(--gold);border-bottom:none;border-radius:45px 45px 0 0}
.bag2:empty::after{content:"The bag is empty";color:var(--mu);align-self:center;margin:0 auto}
.cell{padding:5px 14px;border-radius:10px;color:transparent;border:2px dashed rgba(255,255,255,.3)}
.cell.on{background:#fff;color:var(--ink);border:2px solid #fff;font-weight:700}.cell.new{animation:pop .5s}
.slot{background:#fff;color:var(--ink);border-radius:14px;padding:8px 16px;min-width:116px;text-align:center;position:relative;animation:pop .5s}
.slot b{font-size:21px;display:block}.slot small{display:block;font-size:12px;color:#5b4fa0}
.slot .cnt{position:absolute;top:-13px;right:-11px;min-width:32px;height:32px;line-height:32px;border-radius:16px;background:var(--pink);color:#fff;font-weight:800;font-size:17px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}.ctl input[type=range]{flex:1;min-width:120px}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;table-layout:fixed;width:100%}
th{font-size:15px;color:var(--mu);padding:5px 2px;word-break:break-word;transition:color .2s}
th.rl{width:100px;text-align:left}th.hl{color:var(--gold);transform:scale(1.15)}
td{text-align:center;padding:11px 2px;border-radius:8px;background:rgba(255,255,255,.1);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
td.z{color:rgba(255,255,255,.3);font-weight:400}td.nz{color:var(--ink)}td.new{animation:pop .45s}td.idf{background:rgba(255,107,157,.25);color:#ffd6e3}
.vl{font:16px Consolas,Menlo,monospace;margin-top:8px;overflow-x:auto;white-space:nowrap}
.flips{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}
.flip{perspective:800px;width:130px;height:130px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.flip.on .in{transform:rotateY(180deg)}
.flip b,.flip i{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;border-radius:18px;font-style:normal}
.flip b{background:var(--gold);color:var(--ink);font-size:22px}.flip i{background:#fff;color:var(--ink);font-size:56px;font-weight:800;transform:rotateY(180deg)}
.hint{color:var(--mu)}
.para{line-height:2;margin-bottom:12px}.wd{padding:1px 4px;border-radius:6px;cursor:pointer;transition:background .2s}.wd:hover{background:rgba(255,255,255,.2)}.wd.hi{background:var(--gold);color:var(--ink)}
.br{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;margin-bottom:6px;max-height:40px;overflow:hidden;transition:max-height .6s,opacity .6s,margin .6s;cursor:pointer}
.br>div{background:rgba(255,255,255,.1);border-radius:8px;height:20px;overflow:hidden}.br i{display:block;height:100%;background:var(--sky);transition:width .8s}
.br.stop i{background:var(--pink)}.br.hi i{background:var(--gold)}.br.hi span{color:var(--gold)}
.hide .br.stop{max-height:0;opacity:0;margin:0}
.flow{display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.node{flex:1;min-width:150px;border:3px solid var(--c);border-radius:16px;padding:14px;font-weight:700;cursor:pointer;opacity:.55;transition:all .4s}.node.on{opacity:1;background:var(--c);color:var(--ink);transform:translateY(-8px)}
.node b{display:block;font:800 30px "Bricolage Grotesque";opacity:.7}
.arr{width:36px;display:grid;place-items:center}.arr i{width:100%;height:4px;background:rgba(255,255,255,.3);border-radius:4px}.arr.on i{background:var(--gold);box-shadow:0 0 14px var(--gold)}
.svg{width:100%;max-width:760px}#mk{transition:transform .12s}
.rb{height:230px;position:relative;border-left:3px solid var(--mu);border-bottom:3px solid var(--mu);margin:8px 0 14px;max-width:520px}
.rect{position:absolute;left:0;bottom:0;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:800 24px "Bricolage Grotesque";transition:width .3s,height .3s;overflow:hidden}
.sq{display:flex;flex-wrap:wrap;gap:6px}.sq i{width:34px;height:34px;border-radius:8px;border:2px dashed rgba(255,255,255,.4);transition:all .3s}.sq i.on{background:var(--gold);border:2px solid #fff}
.eq{font:500 clamp(22px,3.4vw,36px) "Bricolage Grotesque";margin:16px 0}.eq b{color:var(--gold)}
.meter{height:24px;background:rgba(255,255,255,.1);border-radius:12px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--mint));transition:width .4s}
.docs3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.dc{border:3px solid rgba(255,255,255,.2);border-radius:16px;padding:14px;transition:all .4s}.dc.on{border-color:var(--c);background:rgba(255,255,255,.1);box-shadow:0 0 28px -4px var(--c)}.dc:not(.on){opacity:.45}
.vb{display:flex;align-items:flex-end;height:120px;margin-top:8px}.vb i{width:46px;background:var(--c);border-radius:8px 8px 0 0;transition:height .6s;display:block}
.big{font:800 54px "Bricolage Grotesque";color:var(--gold)}
.hl2{background:var(--gold);color:var(--ink);padding:0 5px;border-radius:5px;font-weight:700}
.fb{min-height:1.6em;margin-top:6px}.err{color:var(--pink)}
.fly{position:fixed;margin:0;z-index:60;pointer-events:none;transition:none}
.pop{animation:pop .45s}@keyframes pop{40%{transform:scale(1.35)}}
footer{text-align:center;color:var(--mu);padding:40px 0 60px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="bl b1"></div><div class="bl b2"></div>
<div id="pg"></div>
<nav id="nav"><b>Words → Numbers</b><a href="#s1">Bag of Words</a><a href="#s2">Try a sentence</a><a href="#s4">Steps</a><a href="#s7">TF-IDF</a><a href="#s14">Practice</a></nav>
<main id="main"></main>
<footer>Scroll back up any time. Every section is interactive.</footer>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const f=x=>String(Math.round(x*1000)/1000),DC=['#ffb703','#4cc9f0','#ff6b9d'];
const RAW=["Aman and Avni are stressed","Aman went to a therapist","Avni went to download a health chatbot"];
const tok=s=>s.toLowerCase().match(/[a-z0-9']+/g)||[];
let CT=[],sel=0,dt=0;
const later=(fn,ms)=>CT.push(setTimeout(fn,ms)),every=(fn,ms,arr=CT)=>{const id=setInterval(fn,ms);arr.push(id);return id};
const ord=n=>n+((n%100>10&&n%100<14)||n%10>3||n%10===0?'th':['th','st','nd','rd'][n%10]);
function C(){const D=RAW.map(tok),V=[...new Set(D.flat())],N=D.length;const tf=D.map(d=>V.map(w=>d.filter(x=>x===w).length));const df=V.map((w,j)=>tf.filter(r=>r[j]>0).length);return{D,V,N,tf,df,idf:df.map(x=>Math.log10(N/x))}}
const toks=(a,i,c='')=>a.map(x=>`<span class="tok ${c}" style="--c:${DC[i]}">${x}</span>`).join('');
const bars=rows=>rows.map(([k,n,m,c])=>`<div class="br ${c||''}" data-w="${k}"><span>${k}</span><div><i data-p="${n/m*100}" style="width:0"></i></div><b>${n}</b></div>`).join('');
const grow=w=>later(()=>$$('.br i',w).forEach(i=>i.style.width=i.dataset.p+'%'),60);
const tbl=(V,rows,hl)=>`<div class="scroll"><table style="min-width:${100+70*V.length}px"><tr><th class="rl"></th>${V.map((x,j)=>`<th class="${j===hl?'hl':''}">${x}</th>`).join('')}</tr>${rows}</table></div>`;
function countTo(e,v){const s=performance.now();(function g(t){const p=Math.min(1,Math.max(0,(t-s)/700));e.textContent=f(v*p);if(p<1)requestAnimationFrame(g)})(s)}
function fly(a,b,spd){return new Promise(res=>{
 const A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),c=document.createElement('span');
 c.className='tok fly';c.textContent=a.textContent;c.style.setProperty('--c',a.style.getPropertyValue('--c'));
 c.style.left=A.left+'px';c.style.top=A.top+'px';document.body.appendChild(c);
 if(!c.animate){c.remove();res();return}
 const dx=B.left+B.width/2-A.left-A.width/2,dy=B.top+B.height/2-A.top-A.height/2;
 c.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-70}px) scale(1.3)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.7)`,opacity:.3}],{duration:700/spd,easing:'ease-in-out',fill:'forwards'}).onfinish=()=>{c.remove();res()}})}
function player(w,total,draw,ms){
 const mine=CT;
 w.insertAdjacentHTML('beforeend',`<div class="ctl"><button id="pl">▶ Play</button><input type="range" id="sl" min="0" max="${total}" value="0" aria-label="Step"><span id="cp"></span></div>`);
 let p=0,id=0;const stop=()=>{clearInterval(id);id=0;$('#pl',w).textContent='▶ Play'};
 const set=v=>{p=v;$('#sl',w).value=p;draw(p)};
 $('#pl',w).onclick=()=>{if(id){stop();return}if(p>=total)set(0);$('#pl',w).textContent='⏸ Pause';id=every(()=>{set(p+1);if(p>=total)stop()},ms,mine)};
 $('#sl',w).oninput=e=>{stop();set(+e.target.value)};set(0);
}
function picker(w,V,fn,badge){
 w.innerHTML='<div id="pk"></div><div id="out"></div>';let s=Math.min(sel,V.length-1);const box=$('#pk',w);
 const dr=()=>{box.innerHTML=V.map((x,j)=>`<button class="pk ${j===s?'on':''}" data-j="${j}">${x}${badge?`<small>${badge(j)}</small>`:''}</button>`).join('')};
 box.onclick=e=>{const b=e.target.closest('.pk');if(b){s=sel=+b.dataset.j;dr();fn(s,$('#out',w))}};dr();fn(s,$('#out',w));
}

const S=[];
/* 0 hero */
S.push(['Words → Numbers','Computers can’t read. They only understand numbers. Bag of Words and TF-IDF are two ways to turn text into numbers. Tap a card to flip it, then scroll down.',w=>{
 const ws=['aman','went','to','a','therapist'];
 w.innerHTML=`<div class="flips">${ws.map((x,i)=>`<div class="flip"><div class="in"><b>${x}</b><i>${i+1}</i></div></div>`).join('')}</div>`;
 $$('.flip',w).forEach((c,i)=>{c.onclick=()=>c.classList.toggle('on');later(()=>c.classList.add('on'),700+i*350)});
}]);
/* 1 BoW */
const REV="I love this movie! It's sweet, but with satirical humor. The dialogue is great and the adventure scenes are fun... It manages to be whimsical and romantic while laughing at the conventions of the fairy tale genre. I would recommend it to just about anyone. I've seen it several times, and I'm always happy to see it again whenever I have a friend who hasn't seen it yet!";
S.push(['What is Bag of Words?','Bag of Words is an NLP method that converts text into numbers by counting how often each word appears in a corpus. It extracts features from text so machine learning algorithms can use it. Tap any word to find all its copies, then shake the bag: the order is lost, only the counts matter.',w=>{
 const ws=REV.toLowerCase().replace(/['’]/g,' ').match(/[a-z]+/g),cnt={};ws.forEach(x=>cnt[x]=(cnt[x]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
 w.innerHTML=`<div class="two"><div><div class="para" id="para"></div><button id="shk">🎒 Shake the bag</button></div><div>${bars(top.map(([k,n])=>[k,n,top[0][1]]))}</div></div>`;
 let sh=false,hi='';
 const mark=()=>$$('[data-w]',w).forEach(n=>n.classList.toggle('hi',!!hi&&n.dataset.w===hi));
 const para=()=>{const a=ws.slice();if(sh)a.sort(()=>Math.random()-.5);$('#para',w).innerHTML=a.map(x=>`<span class="wd" data-w="${x}">${x}</span>`).join(' ');mark()};
 w.onclick=e=>{const t=e.target.closest('[data-w]');if(t){hi=hi===t.dataset.w?'':t.dataset.w;mark()}};
 $('#shk',w).onclick=()=>{sh=!sh;$('#shk',w).textContent=sh?'↩ Put it back in order':'🎒 Shake the bag';para()};
 para();grow(w);
}]);
/* 2 LAB */
S.push(['Bag of Words lab: type your own sentence','Type any sentence and press Run. Words are read in order. The first time a word appears it glows with “1st” and opens a new card in the bag. Every repeat flies into its card and adds 1 to the count.',w=>{
 w.innerHTML=`<div class="ctl"><input id="bi" value="the cat saw the dog and the cat ran" aria-label="Your sentence" style="flex:3;min-width:240px"><button id="br">▶ Run</button><button id="bk" class="ghost">Skip to result</button><label style="color:var(--mu)">Speed <input type="range" id="bs" min="0.5" max="3" step="0.25" value="1" style="width:110px"></label></div><div class="card" id="bt"></div><div class="say2" id="bm">Press Run.</div><div class="bag2" id="bb"></div><div id="bc"></div>`;
 let g=0;const sp=()=>+$('#bs',w).value,ck=m=>{if(m!==g)throw 'x'},wt=(ms,m)=>new Promise(r=>setTimeout(r,ms/sp())).then(()=>ck(m));
 const say=h=>{$('#bm',w).innerHTML=h};
 const tk=(ws,cls)=>{$('#bt',w).innerHTML=ws.length?ws.map((x,k)=>`<span class="tok ${cls?cls[k][0]:''}" ${cls?`data-n="${cls[k][1]}"`:''} id="bt${k}" style="--c:#ffb703">${x}</span>`).join(' '):'<span class="hint">Type a sentence above.</span>'};
 const slot=(x,k,n)=>{const s=el('div','slot',`<b>${x}</b><small>first seen at word #${k+1}</small><span class="cnt">${n}</span>`);s.dataset.w=x;$('#bb',w).append(s);return s};
 const result=(cnt,total)=>{const rows=[...cnt].sort((a,b)=>b[1]-a[1]);$('#bc',w).innerHTML=`<div class="say2"><b>Done.</b> ${cnt.size} unique words out of ${total} total.<br>Dictionary (order of first appearance): [${[...cnt.keys()].join(', ')}]</div>`+bars(rows.map(([k,n])=>[k,n,rows[0][1]]));grow(w);say('Finished. The bars show how many times each word appeared.')};
 const reset=()=>{g++;const ws=tok($('#bi',w).value);tk(ws);$('#bb',w).innerHTML='';$('#bc',w).innerHTML='';say(ws.length?'Press Run.':'Type a sentence first.');return ws};
 async function run(){const ws=reset(),m=g;if(!ws.length)return;const cnt=new Map();
  try{await wt(300,m);
   for(let k=0;k<ws.length;k++){const x=ws[k],t=$('#bt'+k,w);t.classList.add('hl');let s;
    if(!cnt.has(x)){cnt.set(x,0);s=slot(x,k,0);say(`<b>“${x}”</b> appears for the <b>first time</b>. A new card opens in the bag.`);await wt(500,m)}
    else{s=$$('.slot',w).find(q=>q.dataset.w===x);say(`<b>“${x}”</b> again. This is its <b>${ord(cnt.get(x)+1)}</b> appearance, so the count goes up.`);await wt(350,m)}
    await fly(t,s,sp());ck(m);cnt.set(x,cnt.get(x)+1);const c=$('.cnt',s);c.textContent=cnt.get(x);c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
    t.classList.remove('hl');cnt.get(x)===1?t.classList.add('first'):(t.classList.add('rep'),t.dataset.n=ord(cnt.get(x)));await wt(200,m)}
   result(cnt,ws.length);
  }catch(e){if(e!=='x')throw e}}
 function skip(){const ws=reset(),cnt=new Map(),cls=[];ws.forEach((x,k)=>{const n=(cnt.get(x)||0)+1;cnt.set(x,n);cls.push(n===1?['first','']:['rep',ord(n)])});
  tk(ws,cls);const first=new Map();ws.forEach((x,k)=>{if(!first.has(x))first.set(x,k)});cnt.forEach((n,x)=>slot(x,first.get(x),n));if(ws.length)result(cnt,ws.length)}
 $('#br',w).onclick=run;$('#bk',w).onclick=skip;
 $('#bi',w).oninput=reset;$('#bi',w).onkeydown=e=>{if(e.key==='Enter')run()};reset();
}]);
/* 3 workflow */
S.push(['The Bag of Words workflow','Four stages turn raw text into vectors. Click a stage, or watch the data travel through them.',w=>{
 const st=[['Text Processing','Collect data and pre-process it.','#4cc9f0'],['Create a Dictionary','List all unique words in the corpus.','#ffb703'],['Create Document Vectors','Count word occurrences in each document.','#ff6b9d'],['Create Vectors for All Documents','Apply the process to all documents.','#80ed99']];
 w.innerHTML=`<div class="flow">${st.map((s,i)=>`<div class="node" data-i="${i}" style="--c:${s[2]}"><b>${i+1}</b>${s[0]}</div>${i<3?'<div class="arr"><i></i></div>':''}`).join('')}</div><div class="say2" id="dsc"></div>`;
 let k=0;const go=i=>{k=i;$$('.node',w).forEach((n,j)=>n.classList.toggle('on',j===i));$$('.arr',w).forEach((a,j)=>a.classList.toggle('on',j<i));$('#dsc',w).innerHTML=`<b style="color:${st[i][2]}">${st[i][0]}</b>: ${st[i][1]}`};
 const id=every(()=>go((k+1)%4),2300);
 w.onclick=e=>{const n=e.target.closest('.node');if(n){clearInterval(id);go(+n.dataset.i)}};go(0);
}]);
/* 4 normalize */
S.push(['Step 1: Collect and normalize','Start with three simple documents. Text normalization lowercases the text and removes punctuation, so each document becomes a list of words. Edit these sentences: the textbook-style sections below (steps 2 to 4 and TF-IDF) all use them.',w=>{
 w.innerHTML=RAW.map((r,i)=>`<div class="row" style="--c:${DC[i]}"><b>Doc ${i+1}</b><div><input value="${r}" data-i="${i}" aria-label="Document ${i+1}"><div style="margin-top:6px" id="n${i}"></div></div></div>`).join('');
 const up=()=>RAW.forEach((r,i)=>{$('#n'+i,w).innerHTML='['+toks(tok(r),i)+']'});
 w.oninput=e=>{if(e.target.dataset.i!=null){RAW[+e.target.dataset.i]=e.target.value;up();clearTimeout(dt);dt=setTimeout(()=>[5,6,10,11,13].forEach(bw),400)}};up();
}]);
/* 5 dictionary */
S.push(['Step 2: Create the dictionary','List every unique word from all documents. A word that appears many times is listed only once. Press Play: the first time a word appears it glows with “1st” and drops into the bag. Repeats are skipped.',w=>{
 const {D,V}=C(),flat=D.flatMap((d,i)=>d.map(x=>[x,i])),seen=new Set(),first=flat.map(([x])=>seen.has(x)?false:(seen.add(x),true));
 w.innerHTML='<div id="dd"></div><div class="bag2" id="bg" style="gap:6px"></div>';
 player(w,flat.length,p=>{let k=0;
  $('#dd',w).innerHTML=D.map((d,i)=>`<div class="row"><b style="color:${DC[i]}">Doc ${i+1}</b><div>${d.map(x=>{const n=k++;return `<span class="tok ${n<p?(first[n]?'first':'dup'):''} ${n===p-1?'hl':''}" style="--c:${DC[i]}">${x}</span>`}).join('')}</div></div>`).join('');
  const have=new Set(flat.slice(0,p).map(a=>a[0])),nw=p>0&&first[p-1]?flat[p-1][0]:'';
  $('#bg',w).innerHTML=V.map(x=>`<span class="cell ${have.has(x)?'on':''} ${x===nw?'new':''}">${x}</span>`).join('');
  $('#cp',w).textContent=have.size+' unique word'+(have.size==1?'':'s')},650);
}]);
/* 6 vectors */
S.push(['Steps 3 and 4: Document vectors','The dictionary becomes the header row. For each document, check every dictionary word: present means 1, repeated means add 1, absent means 0. Then repeat for every document. Press Play and watch each vector fill.',w=>{
 const {D,V}=C(),flat=D.flatMap((d,i)=>d.map(x=>[x,i]));
 w.innerHTML='<div class="say2" id="sy"></div><div id="tb"></div><div id="vv"></div>';
 player(w,flat.length,p=>{const c=D.map(()=>V.map(()=>0));flat.slice(0,p).forEach(([x,i])=>c[i][V.indexOf(x)]++);
  const L=p>0?flat[p-1]:null,lj=L?V.indexOf(L[0]):-1;
  $('#tb',w).innerHTML=tbl(V,c.map((r,i)=>`<tr><th class="rl" style="color:${DC[i]}">Doc ${i+1}</th>${r.map((n,j)=>`<td class="${n?'nz':'z'} ${L&&L[1]===i&&lj===j?'new':''}" ${n?`style="background:${DC[i]}"`:''}>${n}</td>`).join('')}</tr>`).join(''),lj);
  $('#vv',w).innerHTML=c.map((r,i)=>`<div class="vl"><b style="color:${DC[i]}">Doc ${i+1}</b> [${r.join(', ')}]</div>`).join('');
  $('#sy',w).innerHTML=p===0?'Press Play to start counting.':p===flat.length?'<b>Done.</b> Each row is a document vector. Together they make the document vector table.':`Doc ${L[1]+1}: <b>“${L[0]}”</b> → add 1 to its column.`},700);
}]);
/* 7 why counts fail */
const PAR="Air pollution is a big problem. The air in the city is full of smoke, and the smoke is a kind of pollution. Pollution is bad for health, and the air that we breathe is the first thing to suffer. Air and pollution are the words that matter.";
const STOP=new Set(['the','is','a','of','and','in','that','we','to','are','it','be']);
S.push(['Why counting isn’t enough','Imagine reading a book. Which words appear most? “the”, “is”, “and”. But do they tell you what the book is about? Not really. Bag of Words counts frequency but ignores how important a word is across documents. Hide the stop words to see what we actually care about.',w=>{
 const cnt={};tok(PAR).forEach(x=>cnt[x]=(cnt[x]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,13);
 w.innerHTML=`<p class="card">${PAR}</p><button id="hs">Hide stop words</button><div class="two"><div>${bars(top.map(([k,n])=>[k,n,top[0][1],STOP.has(k)?'stop':'']))}</div><div class="say2" id="nt">Pink bars are stop words. They win the count but say nothing about the topic.</div></div>`;
 $('#hs',w).onclick=()=>{const h=w.classList.toggle('hide');$('#hs',w).textContent=h?'Show stop words':'Hide stop words';$('#nt',w).textContent=h?'Now “air”, “pollution” and “smoke” stand out. They reveal the topic.':'Pink bars are stop words. They win the count but say nothing about the topic.'};
 grow(w);
}]);
/* 8 curve */
S.push(['Stop words, frequent words, rare words','Plot how often a word occurs against its value. Drag the slider along the curve to meet the three groups. In text analysis we focus on frequent and rare words because they carry the most useful information.',w=>{
 const Z=[['Stop words',0,18,'#ff6b9d','“the”, “is”, “and”. Very high frequency, low value. They make sentences grammatical for humans, so we usually remove them in pre-processing.'],['Frequent words',18,58,'#ffb703','Moderate frequency, some value. They relate to the document’s topic and provide context.'],['Rare / valuable words',58,100,'#80ed99','Low frequency across the corpus, highest value. Topic-specific, they help tell one document from another.']];
 const X=v=>50+v*5.4,Y=v=>240-190*Math.exp(-v/22);let d='';for(let v=0;v<=100;v+=2)d+=(v?'L':'M')+X(v)+' '+Y(v);
 w.innerHTML=`<svg viewBox="0 0 620 296" class="svg">${Z.map(z=>`<rect x="${X(z[1])}" y="20" width="${X(z[2])-X(z[1])}" height="230" fill="${z[3]}" opacity=".16"/><text x="${(X(z[1])+X(z[2]))/2}" y="270" text-anchor="middle" fill="${z[3]}" font-weight="700" font-size="14">${z[0]}</text>`).join('')}<path d="${d}" fill="none" stroke="#fff" stroke-width="4"/><circle id="mk" r="11" fill="#fff" stroke="#1a1442" stroke-width="3"/><text x="320" y="290" text-anchor="middle" fill="#b9b0e6" font-size="13">Value →</text><text transform="rotate(-90)" x="-135" y="18" fill="#b9b0e6" font-size="13" text-anchor="middle">Occurrence →</text></svg><input type="range" id="v" min="0" max="100" value="6" aria-label="Word value"><div class="say2" id="zi"></div>`;
 const up=v=>{v=+v;$('#mk',w).style.transform=`translate(${X(v)}px,${Y(v)}px)`;const z=Z.find(z=>v<=z[2])||Z[2];$('#mk',w).setAttribute('fill',z[3]);$('#zi',w).innerHTML=`<b style="color:${z[3]}">${z[0]}</b>: ${z[4]}`};
 $('#v',w).oninput=e=>up(e.target.value);up(6);
}]);
/* 9 big idea */
S.push(['TF-IDF: the big idea','TF-IDF measures how important a word is in a document relative to a corpus. It asks two questions: how often does the word appear here (TF), and how rare is it across all documents (IDF)? Multiply them. The area of the rectangle is the importance.',w=>{
 w.innerHTML=`<div class="two"><div><div class="pre"><button class="ghost" data-t="6" data-i="0">Stop word</button><button class="ghost" data-t="3" data-i="0.5">Rare topic word</button><button class="ghost" data-t="2" data-i="0.18">Everyday word</button></div><label>TF: times in this document = <b id="tv"></b></label><input type="range" id="tf" min="0" max="6" step="1" value="3"><label>IDF: how rare in the corpus = <b id="iv"></b></label><input type="range" id="id" min="0" max="1" step="0.05" value="0.5"></div><div><div class="rb"><div class="rect" id="rc"></div></div><div class="say2" id="rt"></div></div></div>`;
 const up=()=>{const t=+$('#tf',w).value,i=+$('#id',w).value;$('#tv',w).textContent=t;$('#iv',w).textContent=i;const r=$('#rc',w);r.style.width=t*70+'px';r.style.height=i*220+'px';r.textContent=f(t*i);$('#rt',w).innerHTML=`TF × IDF = ${t} × ${i} = <b>${f(t*i)}</b>`+(i===0?'<br>A big TF can’t save a word that appears everywhere. IDF 0 wipes out the score.':'')};
 w.oninput=up;w.onclick=e=>{const b=e.target.closest('[data-t]');if(b){$('#tf',w).value=b.dataset.t;$('#id',w).value=b.dataset.i;up()}};up();
}]);
/* 10 TF */
S.push(['TF: Term Frequency','Term Frequency is how many times a word appears in a single document. These are exactly the numbers in the document vector table. Pick a word and compare the documents.',w=>{
 const {D,V,tf}=C();
 picker(w,V,(j,o)=>{o.innerHTML=`<div class="docs3">${D.map((d,i)=>`<div class="dc on" style="--c:${DC[i]}"><b style="color:${DC[i]}">Doc ${i+1}</b><div>${d.map(x=>x===V[j]?`<span class="hl2">${x}</span>`:x).join(' ')}</div><div class="vb"><i style="height:0" data-h="${tf[i][j]*36}"></i></div><div class="big">TF = ${tf[i][j]}</div></div>`).join('')}</div>`;later(()=>$$('.vb i',o).forEach(b=>b.style.height=b.dataset.h+'px'),50)});
}]);
/* 11 DF */
S.push(['DF: Document Frequency','Document Frequency is the number of documents a word appears in. It doesn’t matter how many times it appears in each one, only whether it appears or not. The number on each button is its DF.',w=>{
 const {D,V,tf,df,N}=C();
 picker(w,V,(j,o)=>{o.innerHTML=`<div class="docs3">${D.map((d,i)=>`<div class="dc ${tf[i][j]?'on':''}" style="--c:${DC[i]}"><b style="color:${DC[i]}">Doc ${i+1}</b><div>${d.map(x=>x===V[j]?`<span class="hl2">${x}</span>`:x).join(' ')}</div><div>${tf[i][j]?`✔ contains it${tf[i][j]>1?` (${tf[i][j]} times, still counts once)`:''}`:'✘ does not contain it'}</div></div>`).join('')}</div><div class="big">DF = ${df[j]} of ${N} documents</div>`},j=>df[j]);
}]);
/* 12 IDF */
S.push(['IDF: Inverse Document Frequency','Put the total number of documents on top and the document frequency below, then take log₁₀. The more documents contain a word, the lower its IDF. A word in every document scores 0. Drag the sliders or try the examples.',w=>{
 w.innerHTML=`<div class="pre"><button class="ghost" data-n="10" data-d="10">“and”: in 10 of 10</button><button class="ghost" data-n="10" data-d="3">“pollution”: in 3 of 10</button><button class="ghost" data-n="3" data-d="2">“aman”: in 2 of 3</button></div><div class="two"><div><label>Total documents N = <b id="nv"></b></label><input type="range" id="N" min="1" max="20"><label>Documents containing the word (DF) = <b id="dv"></b></label><input type="range" id="D" min="1" max="20"></div><div class="sq" id="sq"></div></div><div class="eq" id="eq"></div><div class="meter"><i id="mt"></i></div><p class="hint" id="mh"></p>`;
 let n=10,d=3;
 const up=()=>{d=Math.min(d,n);$('#N',w).value=n;$('#D',w).max=n;$('#D',w).value=d;$('#nv',w).textContent=n;$('#dv',w).textContent=d;const l=Math.log10(n/d);
  $('#sq',w).innerHTML=Array.from({length:n},(_,k)=>`<i class="${k<d?'on':''}"></i>`).join('');
  $('#eq',w).innerHTML=`IDF = log₁₀(${n}/${d}) = log₁₀(${f(n/d)}) = <b>${f(l)}</b>`;$('#mt',w).style.width=l/Math.log10(20)*100+'%';
  $('#mh',w).textContent=l===0?'The word is in every document, so it has no importance (IDF = 0).':'Gold squares are documents containing the word. The fewer there are, the higher the IDF.'};
 w.oninput=e=>{if(e.target.id==='N')n=+e.target.value;if(e.target.id==='D')d=+e.target.value;up()};
 w.onclick=e=>{const b=e.target.closest('[data-n]');if(b){n=+b.dataset.n;d=+b.dataset.d;up()}};up();
}]);
/* 13 TF-IDF table */
S.push(['TF-IDF: the final scores','Multiply each word’s TF by its IDF. Words in every document shrink to 0 while words specific to one or two documents stand out. Click through the stages, then hover over any cell to see its working.',w=>{
 const {V,tf,idf,df,N}=C();let m=0;
 w.innerHTML=`<div><button data-m="0">1. TF</button><button class="ghost" data-m="1">2. × IDF</button><button class="ghost" data-m="2">3. = TF-IDF</button></div><div id="tb"></div><div class="say2" id="rd">Hover over a cell.</div>`;
 const mx=Math.max(1e-9,...tf.flatMap(r=>r.map((c,j)=>c*idf[j])));
 const draw=()=>{$$('[data-m]',w).forEach(b=>b.classList.toggle('ghost',+b.dataset.m!==m));
  const idr=m>=1?`<tr><th class="rl">IDF</th>${V.map((x,j)=>`<td class="idf">${f(idf[j])}</td>`).join('')}</tr>`:'';
  $('#tb',w).innerHTML=tbl(V,idr+tf.map((r,i)=>`<tr><th class="rl" style="color:${DC[i]}">Doc ${i+1}</th>${r.map((c,j)=>{const v=c*idf[j],p=v/mx;return m<2?`<td data-i="${i}" data-j="${j}" class="${c?'nz':'z'}" ${c?`style="background:${DC[i]}"`:''}>${c}</td>`:`<td data-i="${i}" data-j="${j}" data-v="${v}" class="${v?'nz':'z'}" style="background:${v?`rgba(255,209,102,${.2+.8*p})`:''};${p>.55?'':'color:inherit'}">0</td>`}).join('')}</tr>`).join(''));
  if(m===2)$$('td[data-v]',w).forEach(e=>countTo(e,+e.dataset.v))};
 w.onclick=e=>{const b=e.target.closest('[data-m]');if(b){m=+b.dataset.m;draw()}};
 w.onmouseover=e=>{const t=e.target.closest('td[data-i]');if(t){const i=+t.dataset.i,j=+t.dataset.j;$('#rd',w).innerHTML=`Doc ${i+1}, <b>“${V[j]}”</b>: TF ${tf[i][j]} × log₁₀(${N}/${df[j]}) = ${tf[i][j]} × ${f(idf[j])} = <b>${f(tf[i][j]*idf[j])}</b>`}};
 draw();
}]);
/* 14 try it */
S.push(['Try it yourself','Scenario 1: there are 5 documents and “finance” appears in 3 of them. Scenario 2: there are 4 documents and “leverage” appears in 2 of them. Work out each IDF with the log button on a calculator (base 10), then check. Assume TF = 1 for the final TF-IDF.',w=>{
 const Q=[['finance',5,3],['leverage',4,2]];
 w.innerHTML=Q.map((q,i)=>`<div class="card"><h3 style="margin:0 0 6px">Scenario ${i+1}: “${q[0]}”</h3><p style="margin:0 0 8px">N = ${q[1]}, DF = ${q[2]}. IDF = log₁₀(${q[1]}/${q[2]}) = ?</p><div style="display:flex;gap:10px;max-width:520px"><input type="number" step="0.001" id="a${i}" aria-label="Answer ${i+1}"><button data-c="${i}">Check</button><button class="ghost" data-s="${i}">Steps</button></div><div class="fb" id="fb${i}"></div></div>`).join('');
 w.onclick=e=>{const c=e.target.closest('[data-c]'),s=e.target.closest('[data-s]');if(!c&&!s)return;const i=+(c?c.dataset.c:s.dataset.s);
  const [k,n,d]=Q[i],ans=Math.log10(n/d),fb=$('#fb'+i,w);
  if(s){fb.innerHTML=`Divide: ${n} ÷ ${d} = ${f(n/d)}. Take log₁₀: <b>${f(ans)}</b>. With TF = 1, TF-IDF = 1 × ${f(ans)} = <b>${f(ans)}</b>.`;return}
  const v=parseFloat($('#a'+i,w).value);fb.innerHTML=isNaN(v)?'Type your answer first.':Math.abs(v-ans)<.005?'✔ Correct! Well done.':'✘ Not quite. Divide N by DF first, then press the log button.'};
}]);

/* engine: one long scrolling page */
const main=$('#main'),W=[];
S.forEach((s,i)=>{const sec=el('section','s',`<h2>${s[0]}</h2><p class="ex">${s[1]}</p><div class="w"></div>`);sec.id='s'+i;main.append(sec);W.push($('.w',sec))});
function bw(i){const w=W[i];(w._tm||[]).forEach(t=>{clearTimeout(t);clearInterval(t)});w.onclick=w.oninput=w.onmouseover=null;w.className='w';w.innerHTML='';CT=w._tm=[];
 try{S[i][2](w)}catch(e){w.innerHTML='<p class="err">Something broke in this section: '+e.message+'</p>';console.error(e)}}
S.forEach((s,i)=>bw(i));
const secs=$$('.s');
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});secs.forEach(s=>io.observe(s))}
else secs.forEach(s=>s.classList.add('in'));
secs[0].classList.add('in');
addEventListener('scroll',()=>{const h=document.documentElement;$('#pg').style.width=h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100+'%'},{passive:true});
})();
</script>
</body>
</html>
